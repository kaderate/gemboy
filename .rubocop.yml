AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

# Specs naturally have long describe/context blocks full of small `it`s -
# don't nag about length there.
Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'lib/cpu.rb'

Metrics/ClassLength:
  Max: 300

Metrics/AbcSize:
  Max: 50
  Exclude:
    - 'lib/cpu.rb'

Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - 'lib/cpu.rb'

Metrics/PerceivedComplexity:
  Max: 15
  Exclude:
    - 'lib/cpu.rb'

Layout/LineLength:
  Max: 130

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'spec/**/*'
