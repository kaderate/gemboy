name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  spinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Spinel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl ca-certificates

      - name: Build Spinel
        run: |
          git clone --depth 1 https://github.com/matz/spinel.git /tmp/spinel
          make -C /tmp/spinel deps
          make -C /tmp/spinel

      - name: Compile Gemboy headless target
        run: /tmp/spinel/spinel bin/gemboy-spinel -o gemboy-spinel

  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Run reference ROM specs
        run: bundle exec rspec --tag accuracy

      - name: Upload framebuffers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-framebuffers
          path: tmp/accuracy/
          retention-days: 7

  test_roms_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Run test ROMs and generate report
        run: bundle exec ruby test_roms/run_all.rb

      - name: Upload test ROM report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-roms-report
          path: test_roms/report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Audit dependencies for known vulnerabilities
        run: bundle exec bundle-audit check --update

  mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          SSH_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          git push git@gitlab.com:abk/emu-gb.git HEAD:main
