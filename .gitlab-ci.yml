image: ruby:4.0.1

stages:
  - test

variables:
  BUNDLE_PATH: vendor/bundle

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

.bundle_setup: &bundle_setup
  - apt-get update -qq
  - apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config
  - bundle config set path "$BUNDLE_PATH"
  - bundle install

test:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec rspec
  coverage: '/Line coverage: \d+ \/ \d+ \((\d+\.\d+\%)\)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

test_roms_report:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec ruby test_roms/run_all.rb
  artifacts:
    paths:
      - test_roms/report/
    expire_in: 1 week
    when: always

lint:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec rubocop

security:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec bundle-audit check --update
