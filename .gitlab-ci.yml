image: ruby:4.0.1

stages:
  - test

variables:
  BUNDLE_PATH: vendor/bundle

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

.bundle_setup: &bundle_setup
  - apt-get update -qq
  - apt-get install -y -qq libsdl2-dev pkg-config
  - bundle config set path "$BUNDLE_PATH"
  - bundle install

test:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec rspec
  coverage: '/Line coverage: \d+ \/ \d+ \((\d+\.\d+\%)\)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

security:
  stage: test
  before_script: *bundle_setup
  script:
    - bundle exec bundle-audit check --update
